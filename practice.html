<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wormington Spelling</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


<div class="page">


    <main class="practice-area">


        <div
            class="practice-card"
            id="practiceCard"
        >


            <div class="profile-bar">


                <div class="profile-info">

                    <img
                        id="profileImage"
                        src=""
                        alt="Profile"
                    >

                    <div>

                        <div id="profileName">
                            Profile
                        </div>

                        <div class="profile-subtitle">
                            Current player
                        </div>

                    </div>

                </div>


                <a
                    class="history-button"
                    href="history.html"
                >
                    History
                </a>


            </div>


            <h1>
                Wormington Spelling
            </h1>


            <div id="score">
                Perfect: 0 | Missed: 0
            </div>


            <button
                id="speakButton"
                type="button"
                onclick="speakWord()"
            >
                🔊 Hear Word
            </button>


            <div id="wordDisplay"></div>


            <input
                id="letterInput"
                type="text"
                placeholder="Type a letter..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >


            <div id="message"></div>


            <div id="progress"></div>


            <div class="bottom-links">

                <a href="index.html">
                    ← Change Profile
                </a>

            </div>


        </div>


    </main>



    <aside class="results-panel">


        <h2>
            Today's Words
        </h2>


        <div class="sidebar-subtitle">
            This practice session
        </div>


        <ul id="resultsList"></ul>


    </aside>


</div>


<script src="app.js?v=7"></script>


</body>
</html>
