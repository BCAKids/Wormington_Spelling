<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wormington Spelling</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fb;
            color: #222;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #weekTitle {
            color: #666;
            margin-top: 0;
        }

        #wordDisplay {
            font-size: 44px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 45px 0 25px;
            min-height: 60px;
        }

        #speakButton {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            padding: 14px 25px;
            cursor: pointer;
        }

        #hiddenInput {
            width: 300px;
            max-width: 90%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #aaa;
            border-radius: 10px;
            outline: none;
        }

        #hiddenInput:focus {
            border-color: #4285f4;
        }

        #message {
            font-size: 26px;
            font-weight: bold;
            min-height: 40px;
            margin-top: 20px;
        }

        #progress {
            font-size: 18px;
            color: #666;
            margin-top: 20px;
        }

        .backLink {
            display: inline-block;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Wormington Spelling</h1>

    <h2 id="weekTitle"></h2>

    <button id="speakButton" type="button" onclick="speakWord()">
        🔊 Say Word
    </button>

    <div id="wordDisplay"></div>

    <input
        id="hiddenInput"
        type="text"
        placeholder="Type a letter..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
    >

    <div id="message"></div>

    <div id="progress"></div>

    <a class="backLink" href="index.html">
        ← Choose Another Week
    </a>

    <script src="app.js"></script>

</body>
</html>
