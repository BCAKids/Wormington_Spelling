<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wormington Spelling</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        /* LEFT SIDE - PRACTICE */

        .practiceArea {
            flex: 1;
            text-align: center;
            padding: 35px 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #weekTitle {
            color: #666;
            margin-top: 0;
        }

        #wordDisplay {
            font-size: 44px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 45px 0 25px;
            min-height: 60px;
        }

        #speakButton {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            padding: 14px 25px;
            cursor: pointer;
        }

        #hiddenInput {
            width: 300px;
            max-width: 90%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #aaa;
            border-radius: 10px;
            outline: none;
        }

        #hiddenInput:focus {
            border-color: #4285f4;
        }

        #message {
            font-size: 26px;
            font-weight: bold;
            min-height: 40px;
            margin-top: 20px;
        }

        #progress {
            font-size: 18px;
            color: #666;
            margin-top: 20px;
        }

        .backLink {
            display: inline-block;
            margin-top: 40px;
        }

        /* RIGHT SIDE - RESULTS */

        .resultsPanel {
            width: 260px;
            background: white;
            border-left: 1px solid #ddd;
            padding: 25px;
        }

        .resultsPanel h2 {
            margin-top: 0;
            text-align: center;
        }

        #resultsList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #resultsList li {
            padding: 10px 5px;
            border-bottom: 1px solid #eee;
            font-size: 20px;
        }

        .correct {
            color: #188038;
        }

        .missed {
            color: #d93025;
        }

        /* PHONE / SMALL SCREEN */

        @media (max-width: 700px) {

            .page {
                display: block;
            }

            .resultsPanel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
                margin-top: 20px;
            }

        }
    </style>
</head>

<body>

<div class="page">

    <main class="practiceArea">

        <h1>Wormington Spelling</h1>

        <h2 id="weekTitle"></h2>

        <button
            id="speakButton"
            type="button"
            onclick="speakWord()">

            🔊 Say Word

        </button>

        <div id="wordDisplay"></div>

        <input
            id="hiddenInput"
            type="text"
            placeholder="Type a letter..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <div id="message"></div>

        <div id="progress"></div>

        <a class="backLink" href="index.html">
            ← Choose Another Week
        </a>

    </main>


    <aside class="resultsPanel">

        <h2>Progress</h2>

        <ul id="resultsList"></ul>

    </aside>

</div>

<script src="app.js?v=3"></script>

</body>
</html>
