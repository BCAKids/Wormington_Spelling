<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wormington Spelling</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #222;
        }

        .page {
            display: flex;
            min-height: 100vh;
        }


        /* MAIN PRACTICE AREA */

        .practice-area {
            flex: 1;
            padding: 35px;
            display: flex;
            justify-content: center;
        }

        .practice-card {
            width: 100%;
            max-width: 750px;
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .score {
            color: #777;
            font-size: 18px;
            margin-bottom: 30px;
        }

        #speakButton {
            border: none;
            background: #4285f4;
            color: white;
            font-size: 21px;
            font-weight: bold;
            padding: 15px 26px;
            border-radius: 14px;
            cursor: pointer;
        }


        /* SPELLING LETTERS */

        #wordDisplay {
            font-size: 46px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 45px 0 28px;
            min-height: 65px;
            word-wrap: break-word;
        }


        /* INPUT */

        #letterInput {
            width: 300px;
            max-width: 90%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 3px solid #d0d5dd;
            border-radius: 14px;
            outline: none;
        }

        #letterInput:focus {
            border-color: #4285f4;
        }


        /* MESSAGES */

        #message {
            font-size: 30px;
            font-weight: bold;
            min-height: 50px;
            margin-top: 20px;
        }

        #progress {
            color: #777;
            font-size: 18px;
            margin-top: 15px;
        }


        /* SIDEBAR */

        .results-panel {
            width: 280px;
            background: white;
            border-left: 1px solid #ddd;
            padding: 25px;
            overflow-y: auto;
        }

        .results-panel h2 {
            text-align: center;
            margin-top: 0;
        }

        #resultsList {
            list-style: none;
            padding: 0;
        }

        #resultsList li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
        }

        .correct {
            color: #188038;
        }

        .missed {
            color: #d93025;
        }


        /* ANIMATIONS */

        .shake {
            animation: shake .35s;
        }

        @keyframes shake {

            0% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }

        }

        .success {
            animation: successPop .55s;
        }

        @keyframes successPop {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        /* CELEBRATION EMOJI */

        .celebration {
            position: absolute;
            font-size: 45px;
            pointer-events: none;
            animation: fly 1.2s forwards;
        }

        @keyframes fly {

            0% {
                transform: translateY(0) scale(.5) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-250px) scale(1.5) rotate(360deg);
                opacity: 0;
            }

        }


        /* PHONE */

        @media (max-width: 750px) {

            .page {
                display: block;
            }

            .practice-area {
                padding: 15px;
            }

            .practice-card {
                padding: 25px 15px;
            }

            .results-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ddd;
            }

            #wordDisplay {
                font-size: 34px;
                letter-spacing: 5px;
            }

        }

    </style>
</head>


<body>

<div class="page">


    <main class="practice-area">

        <div
            class="practice-card"
            id="practiceCard">


            <h1>Wormington Spelling</h1>


            <div
                class="score"
                id="score">
                Correct: 0
            </div>


            <button
                id="speakButton"
                onclick="speakWord()">

                🔊 Hear Word

            </button>


            <div id="wordDisplay"></div>


            <input
                id="letterInput"
                type="text"
                placeholder="Type a letter..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false">


            <div id="message"></div>


            <div id="progress"></div>


        </div>

    </main>



    <aside class="results-panel">

        <h2>Today's Words</h2>

        <ul id="resultsList"></ul>

    </aside>


</div>


<script src="app.js?v=4"></script>

</body>
</html>
