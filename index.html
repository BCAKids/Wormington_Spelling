<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wormington Practice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="home-page">


<div class="container">


    <div class="header">

        <h1>
            Wormington Practice
        </h1>

        <p>
            What do you want to practice?
        </p>

    </div>


    <div class="activity-grid">


        <!-- SPELLING -->

        <a
            class="activity-card spelling-card"
            href="spelling.html"
        >

            <div class="activity-icon">
                ✏️
            </div>

            <div class="activity-title">
                Spelling
            </div>

            <div class="activity-description">
                Hear the word and spell it one letter at a time.
            </div>

            <div class="activity-button">
                Start Spelling
            </div>

        </a>


        <!-- VOCABULARY -->

        <a
            class="activity-card vocab-card"
            href="vocab.html"
        >

            <div class="activity-icon">
                📚
            </div>

            <div class="activity-title">
                Vocabulary
            </div>

            <div class="activity-description">
                Match each definition to the correct word.
            </div>

            <div class="activity-button">
                Start Vocabulary
            </div>

        </a>


        <!-- MATH -->

        <div
            class="activity-card math-card coming-soon"
        >

            <div class="coming-soon-badge">
                Coming Soon
            </div>

            <div class="activity-icon">
                ➗
            </div>

            <div class="activity-title">
                Math
            </div>

            <div class="activity-description">
                Practice math skills and problem solving.
            </div>

            <div class="activity-button disabled">
                Coming Soon
            </div>

        </div>


    </div>


</div>


</body>
</html>
