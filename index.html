<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wormington Spelling</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="home-page">


<div class="container">


    <div class="header">

        <h1>
            Wormington Spelling
        </h1>

        <p>
            Choose your profile
        </p>

    </div>


    <div class="profiles">


        <!-- RACCOON -->

        <div
            class="profile-card"
            data-profile="raccoon"
            onclick="selectProfile('raccoon')"
        >

            <img
                class="profile-image"
                src="images/raccoon.png"
                alt="Raccoon"
            >

            <div class="profile-name">
                Raccoon
            </div>

            <div
                class="history-summary"
                id="raccoonSummary"
            >
            </div>

            <a
                class="history-button"
                href="history.html"
                onclick="openHistory(event, 'raccoon')"
            >
                View History
            </a>

            <button
                class="clear-button"
                type="button"
                onclick="clearProfile(event, 'raccoon')"
            >
                Clear Profile
            </button>

        </div>


        <!-- POTATO -->

        <div
            class="profile-card"
            data-profile="potato"
            onclick="selectProfile('potato')"
        >

            <img
                class="profile-image"
                src="images/potato.png"
                alt="Potato"
            >

            <div class="profile-name">
                Potato
            </div>

            <div
                class="history-summary"
                id="potatoSummary"
            >
            </div>

            <a
                class="history-button"
                href="history.html"
                onclick="openHistory(event, 'potato')"
            >
                View History
            </a>

            <button
                class="clear-button"
                type="button"
                onclick="clearProfile(event, 'potato')"
            >
                Clear Profile
            </button>

        </div>


        <!-- BIRD -->

        <div
            class="profile-card"
            data-profile="bird"
            onclick="selectProfile('bird')"
        >

            <img
                class="profile-image"
                src="images/bird.png"
                alt="Bird"
            >

            <div class="profile-name">
                Bird
            </div>

            <div
                class="history-summary"
                id="birdSummary"
            >
            </div>

            <a
                class="history-button"
                href="history.html"
                onclick="openHistory(event, 'bird')"
            >
                View History
            </a>

            <button
                class="clear-button"
                type="button"
                onclick="clearProfile(event, 'bird')"
            >
                Clear Profile
            </button>

        </div>


    </div>


    <div class="start-area">

        <div
            class="selected-label"
            id="selectedLabel"
        >
            Select a profile to begin.
        </div>

        <button
            id="startButton"
            type="button"
            disabled
            onclick="startPractice()"
        >
            Start Practice
        </button>

    </div>


</div>


<script>

const profiles = {

    raccoon: {
        name: "Raccoon"
    },

    potato: {
        name: "Potato"
    },

    bird: {
        name: "Bird"
    }

};


const HISTORY_KEY =
    "wormingtonSpellingHistory";


let selectedProfileId =
    localStorage.getItem(
        "wormingtonSelectedProfile"
    );



function selectProfile(profileId) {

    selectedProfileId =
        profileId;


    localStorage.setItem(
        "wormingtonSelectedProfile",
        profileId
    );


    document
        .querySelectorAll(
            ".profile-card"
        )
        .forEach(
            card =>
                card.classList.remove(
                    "selected"
                )
        );


    const selectedCard =
        document.querySelector(
            '[data-profile="' +
            profileId +
            '"]'
        );


    if (selectedCard) {

        selectedCard.classList.add(
            "selected"
        );

    }


    document.getElementById(
        "selectedLabel"
    ).textContent =

        profiles[profileId].name
        +
        " selected";


    document.getElementById(
        "startButton"
    ).disabled =
        false;

}



function startPractice() {

    if (!selectedProfileId) {
        return;
    }


    localStorage.setItem(
        "wormingtonSelectedProfile",
        selectedProfileId
    );


    window.location.href =
        "practice.html";

}



function openHistory(
    event,
    profileId
) {

    event.stopPropagation();

    event.preventDefault();


    localStorage.setItem(
        "wormingtonSelectedProfile",
        profileId
    );


    window.location.href =
        "history.html";

}



function loadHistory() {

    const saved =
        localStorage.getItem(
            HISTORY_KEY
        );


    if (!saved) {

        return {};

    }


    try {

        return JSON.parse(
            saved
        );

    }

    catch {

        return {};

    }

}



function showProfileSummaries() {

    const history =
        loadHistory();


    for (
        const profileId
        of Object.keys(profiles)
    ) {

        const summaryElement =
            document.getElementById(
                profileId +
                "Summary"
            );


        const data =
            history[profileId];


        if (!data) {

            summaryElement.innerHTML =

                "No practice yet.<br>" +
                "Be the first.";

            continue;

        }


        const sessions =
            data.sessions
                ? data.sessions.length
                : 0;


        const wordsPracticed =
            data.wordsPracticed
                || 0;


        let troubleWords =
            0;


        if (data.wordStats) {

            for (
                const wordData
                of Object.values(
                    data.wordStats
                )
            ) {

                if (
                    wordData.missed > 0
                ) {

                    troubleWords++;

                }

            }

        }


        summaryElement.innerHTML =

            "Sessions: "
            + sessions
            + "<br>" +

            "Words practiced: "
            + wordsPracticed
            + "<br>" +

            "Trouble words: "
            + troubleWords;

    }

}



function clearProfile(
    event,
    profileId
) {

    event.stopPropagation();


    const profileName =
        profiles[profileId].name;


    const confirmed =
        confirm(
            "Clear all saved history for "
            + profileName
            + "?"
        );


    if (!confirmed) {
        return;
    }


    const history =
        loadHistory();


    history[profileId] = {

        sessions: [],
        wordsPracticed: 0,
        perfectWords: 0,
        missedWords: 0,
        wordStats: {}

    };


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );


    showProfileSummaries();

}



function restoreSelection() {

    if (
        selectedProfileId
        &&
        profiles[selectedProfileId]
    ) {

        selectProfile(
            selectedProfileId
        );

    }

}



showProfileSummaries();

restoreSelection();

</script>


</body>
</html>
