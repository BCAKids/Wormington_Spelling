<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spelling - Wormington Practice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="page">


    <!-- =========================
         MAIN SPELLING AREA
         ========================= -->

    <main class="practice-area">


        <div
            class="practice-card"
            id="practiceCard"
        >


            <!-- TOP NAVIGATION -->

            <div class="profile-bar">


                <div class="profile-info">

                    <div>

                        <div id="profileName">
                            ✏️ Spelling
                        </div>

                        <div class="profile-subtitle">
                            Listen to the word and spell it.
                        </div>

                    </div>

                </div>


                <div class="profile-actions">

                    <a
                        class="history-button"
                        href="index.html"
                    >
                        🏠 Home
                    </a>

                </div>


            </div>



            <!-- TITLE -->

            <h1>
                Spelling Practice
            </h1>



            <!-- SCORE -->

            <div id="score">
                Perfect: 0 | Missed: 0
            </div>



            <!-- HEAR WORD -->

            <button
                id="speakButton"
                type="button"
                onclick="speakWord()"
            >
                🔊 Hear Word
            </button>



            <!-- SPELLING DISPLAY -->

            <div id="wordDisplay">
            </div>



            <!-- LETTER INPUT -->

            <input
                id="letterInput"
                type="text"
                placeholder="Type a letter..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >



            <!-- FEEDBACK -->

            <div id="message">
            </div>



            <!-- PROGRESS -->

            <div id="progress">
            </div>



            <!-- BOTTOM NAV -->

            <div class="bottom-links">

                <a href="index.html">
                    ← Back to Activities
                </a>

            </div>


        </div>


    </main>



    <!-- =========================
         SESSION RESULTS
         ========================= -->

    <aside class="results-panel">


        <h2>
            Today's Words
        </h2>


        <div class="sidebar-subtitle">
            This practice session
        </div>


        <ul id="resultsList">
        </ul>


    </aside>


</div>


<script src="weekly-words.js?v=1"></script>
<script src="spelling.js?v=2"></script>



</body>

</html>
